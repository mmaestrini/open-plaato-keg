# ─── Open Plaato v2 frontend — nginx config ────────────────────────────
#
# Serves the React SPA from /usr/share/nginx/html and transparently proxies
# the JSON API + WebSocket to the Elixir backend (`open_plaato_keg` service
# on the same Docker network).
# ───────────────────────────────────────────────────────────────────────

upstream plaato_backend {
  server open_plaato_keg:8085;
}

server {
  listen 80 default_server;
  server_name _;

  # Static SPA assets
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed assets (Vite emits hashed filenames in /assets)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # WebSocket — keep-alive and upgrade headers required
  location /ws {
    proxy_pass http://plaato_backend/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 24h;
  }

  # JSON / REST API
  location /api/ {
    proxy_pass http://plaato_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Uploads (tap handle images, etc.)
  location /uploads/ {
    proxy_pass http://plaato_backend;
  }

  # SPA fallback — everything else returns index.html for client-side routing
  location / {
    try_files $uri $uri/ /index.html;
  }
}
